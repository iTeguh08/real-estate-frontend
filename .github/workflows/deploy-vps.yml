# Production Next → VPS (baliestate.web.id). Not GitHub Pages / Vite.
# Requires repo secret: VPS_SSH_PRIVATE_KEY (OpenSSH private key that can SSH as DEPLOY_HOST).
# Optional repo variables: DEPLOY_HOST (default root@103.193.179.62), DEPLOY_PATH.
name: Deploy VPS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build:prod

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          host="${DEPLOY_HOST:-root@103.193.179.62}"
          host="${host#*@}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts

      - name: Rsync .next + restart PM2
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SKIP_BUILD: '1'
        run: |
          export DEPLOY_HOST="${DEPLOY_HOST:-root@103.193.179.62}"
          export DEPLOY_PATH="${DEPLOY_PATH:-/var/www/real-estate-frontend}"
          bash scripts/deploy.sh
