name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint has existing rule debt (set-state-in-effect, etc.) — do not block merge yet.
      # Re-enable with: npm run lint
      - name: Unit tests
        run: npm test

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK: 'false'
          VITE_USE_MOCK: 'false'

      - name: Vite SPA typecheck
        run: npx tsc -p tsconfig.app.json
